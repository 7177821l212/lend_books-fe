<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#0d7a36"/>
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e0f2e9;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Subtle inner glow ring -->
  <rect x="32" y="32" width="960" height="960" rx="196" ry="196" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Book body (right pages) -->
  <rect x="320" y="220" width="384" height="510" rx="18" ry="18" fill="url(#book)" opacity="0.97"/>

  <!-- Book spine / left cover -->
  <rect x="256" y="220" width="80" height="510" rx="18" ry="18" fill="rgba(255,255,255,0.6)"/>
  <!-- Spine shadow line -->
  <rect x="320" y="220" width="6" height="510" fill="rgba(0,0,0,0.07)"/>

  <!-- Horizontal lines on right page -->
  <rect x="364" y="316" width="292" height="14" rx="7" fill="#16a34a" opacity="0.18"/>
  <rect x="364" y="354" width="220" height="14" rx="7" fill="#16a34a" opacity="0.12"/>
  <rect x="364" y="540" width="292" height="14" rx="7" fill="#16a34a" opacity="0.18"/>
  <rect x="364" y="578" width="220" height="14" rx="7" fill="#16a34a" opacity="0.12"/>
  <rect x="364" y="616" width="260" height="14" rx="7" fill="#16a34a" opacity="0.12"/>

  <!-- Rupee symbol centered on book -->
  <text
    x="512"
    y="506"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="220"
    font-weight="800"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="#16a34a"
    opacity="0.92"
  >₹</text>

  <!-- Bottom shadow under book -->
  <ellipse cx="512" cy="742" rx="190" ry="14" fill="rgba(0,0,0,0.13)"/>
</svg>
